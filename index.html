{t:'4. Ξαναδοκιμάζω με νέους κίονες',ch:[['i','ΙΩΝΙΚΟΣ'],['d','ΔΩΡΙΚΟΣ']],hint:'Κοίταξε προσεκτικά το κιονόκρανο. Είναι απλό ή έχει χαρακτηριστικές έλικες;',cards:[
['d','Κίονας Ζ','https://commons.wikimedia.org/wiki/Special:Redirect/file/Old_Athena_Temple_column_capitals_02.jpg?width=700'],['i','Κίονας Η','https://commons.wikimedia.org/wiki/Special:Redirect/file/Ionic_capital1.JPG?width=700']]}

];
let gi=0,s=null,k=0,done=G.map(x=>x.cards.map(()=>false));
function draw(){let q=G[gi];title.textContent=q.t;g.innerHTML='';q.cards.forEach((c,i)=>{let d=document.createElement('div');d.className='c'+(done[gi][i]?' done':'');d.id='c'+i;d.innerHTML='<img src="'+c[2]+'" alt="'+c[1]+'"><div class="n">'+c[1]+'</div>';d.onclick=()=>sel(i);g.appendChild(d)});z.innerHTML='';q.ch.forEach(c=>{let d=document.createElement('div');d.className='zone';d.textContent=c[1];d.onclick=()=>ans(c[0]);z.appendChild(d)});s=null}
function sel(i){if(done[gi][i])return;document.querySelectorAll('.c').forEach(x=>x.classList.remove('sel'));s=i;document.getElementById('c'+i).classList.add('sel');msg('Τώρα επίλεξε τη σωστή κατηγορία.','f')}
function ans(a){if(s===null){msg('Πρώτα επίλεξε μία εικόνα.','f try');return}let q=G[gi];if(q.cards[s][0]===a){done[gi][s]=true;k++;document.getElementById('c'+s).classList.add('done');s=null;p.textContent=k+' / 8 αποστολές';if(done[gi].every(Boolean)){if(gi<G.length-1){msg('Μπράβο! Ολοκλήρωσες αυτή την αποστολή.','f ok');setTimeout(()=>{gi++;draw();msg('Διάλεξε μία εικόνα.','f')},800)}else msg('Μπράβο! Ολοκλήρωσες την αποστολή του μικρού αρχαιολόγου!','f fin')}else msg('Σωστά! Διάλεξε την επόμενη εικόνα.','f ok')}else msg(q.hint,'f try')}
function msg(t,c){f.textContent=t;f.className=c}function reset(){gi=0;s=null;k=0;done=G.map(x=>x.cards.map(()=>false));p.textContent='0 / 8 αποστολές';draw();msg('Διάλεξε μία εικόνα για να ξεκινήσεις.','f')}draw();
</script></body></html>
